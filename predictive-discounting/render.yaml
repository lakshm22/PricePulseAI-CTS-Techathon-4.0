services:
  - type: web
    name: pricepulse-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EXCEL_FILE_PATH
        value: excel/store_inventory.xlsx
      - key: APP_ENV
        value: production
